<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/main.js"></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <form action="" class="form">
                <div class="input-group">
                    <label for="name" class="label">Name</label>
                    <input type="text" class="input" id="name">
                    <small class="error hidden"></small>
                </div>
                <div class="input-group">
                    <label for="surname" class="label">Surname</label>
                    <input type="text" class="input" id="surname">
                    <small class="error hidden"></small>
                </div>
                <div class="input-group">
                    <label for="dateofbirth" class="label">Date of Birth</label>
                    <input type="date" class="input" id="dateofbirth">
                    <small class="error hidden"></small>
                </div>
                <div class="input-group">
                    <label for="phonenumber" class="label">Phone number</label>
                    <input type="text" class="input" id="phonenumber">
                    <small class="error hidden"></small>
                </div>
                <div class="input-group">
                    <label for="email" class="label">Email</label>
                    <input type="email" class="input" id="email">
                    <small class="error hidden"></small>
                </div>
                <div class="input-group">
                    <label for="password" class="label">Password</label>
                    <input type="password" class="input" id="password">
                    <small class="error hidden"></small>
                </div>
                <div class="input-group-terms-and-conditions">
                    <label for="termsandconditions" class="label">
                        <input type="checkbox" id="termsandconditions" class="checkbox">
                        I have read and agree to the website terms and conditions
                    </label>
                    <small class="error hidden"></small>
                </div>
                <input type="submit" class="submit" value="Submit" id="submit">
            </form>
        </div>
    </div>
</body>
</html>
