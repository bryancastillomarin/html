<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/main.js"></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="app">
                <h1 class="title">TO-DO List</h1>
                <form action="#" class="form">
                    <input type="text" class="new-todo" placeholder="Add your task">
                    <button class="add-todo">ADD</button>
                </form>
                <div class="todos-container">
                    <div class="todo">
                        <div class="todo-info">
                            <label for="todo1" class="todo-text">
                                <input id="todo1" type="checkbox" class="mark-as-done">
                                Todo
                            </label>
                        </div>
                        <div class="todo-actions">
                            <button class="remove">&#9747;</button>
                        </div>
                    </div>
                    <div class="todo">
                        <div class="todo-info">
                            <label for="todo2" class="todo-text">
                                <input id="todo2" type="checkbox" class="mark-as-done">
                                Todo
                            </label>
                        </div>
                        <div class="todo-actions">
                            <button class="remove">&#9747;</button>
                        </div>
                    </div>
                    <div class="todo">
                        <div class="todo-info">
                            <label for="todo3" class="todo-text">
                                <input id="todo3" type="checkbox" class="mark-as-done">
                                Todo
                            </label>
                        </div>
                        <div class="todo-actions">
                            <button class="remove">&#9747;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
