<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/main.js"></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="app">
                <h1 class="title">TO-DO List</h1>
                <form action="#" class="form">
                    <input type="text" id="new-todo" class="new-todo" placeholder="Add your task">
                    <input type="submit" class="add-todo" id="add-todo">
                </form>
                <small id="error" class="error hidden">abcd</small>
                <div class="todos-container">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
